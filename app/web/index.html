<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Прототип персональной подготовки к ЕГЭ по профильной математике">
  <title>Вектор — подготовка к ЕГЭ</title>
  <link rel="stylesheet" href="/assets/styles.css?v=interface-review-2">
</head>
<body>
  <section class="auth-shell" id="auth-shell" aria-labelledby="auth-title">
    <div class="auth-layout">
      <div class="auth-intro">
        <div class="brand auth-brand" aria-label="Вектор">вектор</div>
        <h1 id="auth-title">Подготовка к ЕГЭ по математике</h1>
      </div>

      <div class="auth-card">
        <div class="auth-tabs" role="tablist" aria-label="Вход или регистрация">
          <button class="auth-tab active" id="login-tab" type="button" role="tab" aria-selected="true" aria-controls="login-form">Вход</button>
          <button class="auth-tab" id="register-tab" type="button" role="tab" aria-selected="false" aria-controls="register-form" tabindex="-1">Регистрация</button>
        </div>

        <form class="auth-form" id="login-form" role="tabpanel" aria-labelledby="login-tab">
          <label for="login-email">Электронная почта</label>
          <input id="login-email" name="email" type="email" autocomplete="email" placeholder="student@example.ru" required>
          <label for="login-password">Пароль</label>
          <input id="login-password" name="password" type="password" autocomplete="current-password" required>
          <button class="primary-button auth-submit" type="submit">Войти</button>
        </form>

        <form class="auth-form hidden" id="register-form" role="tabpanel" aria-labelledby="register-tab">
          <label for="register-name">Имя</label>
          <input id="register-name" name="display_name" type="text" autocomplete="name" minlength="1" maxlength="120" placeholder="Как к вам обращаться" required>
          <label for="register-email">Электронная почта</label>
          <input id="register-email" name="email" type="email" autocomplete="email" placeholder="student@example.ru" required>
          <label for="register-password">Пароль</label>
          <input id="register-password" name="password" type="password" autocomplete="new-password" minlength="8" maxlength="128" placeholder="Не менее 8 символов" required>
          <label for="register-password-confirmation">Повторите пароль</label>
          <input id="register-password-confirmation" name="password_confirmation" type="password" autocomplete="new-password" minlength="8" maxlength="128" required>
          <button class="primary-button auth-submit" type="submit">Создать аккаунт</button>
        </form>

        <details class="auth-progress-note"><summary>О сохранении прогресса</summary><p>Учебный прогресс сбрасывается при перезапуске сервера. Аккаунт сохраняется.</p></details>
        <p class="auth-status" id="auth-status" role="alert" aria-live="assertive"></p>
      </div>
    </div>
  </section>

  <div class="app-shell hidden" id="app-shell">
    <header class="site-header">
      <div class="topbar">
        <div class="topbar-main">
          <div class="brand" aria-label="Вектор">
            <span>вектор</span>
          </div>

          <div class="topbar-actions">
            <button class="role-switch" id="role-switch" type="button" aria-label="Открыть меню аккаунта" aria-haspopup="menu" aria-expanded="false" aria-controls="account-menu">
              <span class="avatar">УЧ</span>
              <span><b id="role-name">Ученик</b><small class="hidden" id="role-label">Личный кабинет</small></span>
            </button>
            <div class="account-menu hidden" id="account-menu" role="menu">
              <div><b id="account-menu-name">Ученик</b><small id="account-menu-role">Личный кабинет</small></div>
              <button id="logout-button" type="button" role="menuitem">Выйти из аккаунта</button>
            </div>
          </div>
        </div>

        <nav class="nav" aria-label="Разделы обучения">
          <button class="nav-item active" data-page="dashboard"><b>Главная</b></button>
          <button class="nav-item" data-page="lessons"><b>Уроки</b></button>
          <button class="nav-item" data-page="theory"><b>Пройденная теория</b></button>
          <button class="nav-item" data-page="homework"><b>Домашние задания</b><i class="nav-badge hidden" id="homework-badge">1</i></button>
          <button class="nav-item" data-page="roadmap"><b>Роадмап</b></button>
          <button class="nav-item" data-page="analytics"><b>Аналитика</b></button>
          <button class="nav-item admin-only hidden" data-page="admin"><b>Управление</b></button>
        </nav>
      </div>
    </header>

    <div class="main-column">
      <main id="view" tabindex="-1">
        <div class="loading-state">
          <span class="loader"></span>
          <p>Загрузка…</p>
        </div>
      </main>
    </div>
  </div>

  <div class="toast-region" id="toast-region" aria-live="polite"></div>
  <script src="/assets/app.js?v=interface-review-2" defer></script>
</body>
</html>
