<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Прототип персональной подготовки к ЕГЭ по профильной математике">
  <title>Вектор — подготовка к ЕГЭ</title>
  <link rel="stylesheet" href="/assets/styles.css?v=compact-home-1">
</head>
<body>
  <div class="app-shell">
    <header class="site-header">
      <div class="topbar">
        <div class="topbar-main">
          <div class="brand" aria-label="Вектор">
            <span>вектор</span>
          </div>

          <div class="topbar-actions">
            <button class="role-switch" id="role-switch" type="button" aria-label="Сменить роль">
              <span class="avatar">УЧ</span>
              <span><b id="role-name">Ученик</b><small id="role-label">Текущая сессия</small></span>
            </button>
          </div>
        </div>

        <nav class="nav" aria-label="Разделы обучения">
          <button class="nav-item active" data-page="dashboard"><b>Главная</b></button>
          <button class="nav-item" data-page="lessons"><b>Уроки</b><i class="nav-badge">1</i></button>
          <button class="nav-item" data-page="homework"><b>Домашние задания</b><i class="nav-badge hidden" id="homework-badge">1</i></button>
          <button class="nav-item" data-page="roadmap"><b>Роадмап</b></button>
          <button class="nav-item" data-page="analytics"><b>Аналитика</b></button>
          <button class="nav-item admin-only hidden" data-page="admin"><b>Управление</b></button>
        </nav>
      </div>
    </header>

    <div class="main-column">
      <main id="view" tabindex="-1">
        <div class="loading-state">
          <span class="loader"></span>
          <p>Собираем ваш учебный план…</p>
        </div>
      </main>
    </div>
  </div>

  <div class="toast-region" id="toast-region" aria-live="polite"></div>
  <script src="/assets/app.js?v=compact-home-1" defer></script>
</body>
</html>
